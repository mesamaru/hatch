<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Hatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7; --bg2:#FFFFFF; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --indigo:#5856D6; --teal:#30B0C7; --gray:#8E8E93;
  --glass:rgba(250,250,252,var(--ga)); --glass-line:rgba(0,0,0,.14); --glass-hi:rgba(255,255,255,.7);
  --ga:.72; --blur:24px; --r-group:22px; --r-card:18px;
  --shadow:0 8px 32px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --bg2:#1C1C1E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --indigo:#5E5CE6; --teal:#40C8E0;
  --glass:rgba(30,30,32,var(--ga)); --glass-line:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.08); --shadow:0 8px 32px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#1C1C1E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --indigo:#5E5CE6; --teal:#40C8E0;
  --glass:rgba(30,30,32,var(--ga)); --glass-line:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.08); --shadow:0 8px 32px rgba(0,0,0,.5);
}
@media (prefers-reduced-transparency:reduce){:root{--ga:.97!important}}
html{height:100%;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.88em;letter-spacing:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 60%,transparent);outline-offset:2px;border-radius:10px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);border:.5px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
/* ---- 背景 ---- */
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
#bg .img{position:absolute;inset:-40px;background:var(--bgimg,none) center/cover no-repeat;filter:blur(var(--bgblur,0px))}
#bg .dim{position:absolute;inset:0;background:var(--bg);opacity:var(--dim,0)}
.has-bg body{background:transparent}
.has-bg .large,.has-bg .subtitle,.has-bg .gh,.has-bg .gf,.has-bg .navbar:not(.scrolled) .back{text-shadow:0 0 14px var(--bg),0 0 3px var(--bg),0 0 1px var(--bg)}
.has-bg .gh,.has-bg .gf,.has-bg .subtitle{color:color-mix(in srgb,var(--label) 75%,transparent)}
.bgpick{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))!important}
.bgpick .pk{padding:8px 8px 10px;min-height:0}
.bgpick .pk b{font-size:15px}.bgpick .pk small{font-size:12px}
.sw svg{width:26px;height:26px}
.sw{display:block;height:52px;border-radius:12px;margin-bottom:6px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 .5px var(--sep)}
.bgprev{position:relative;height:150px;border-radius:18px;overflow:hidden;margin-bottom:6px}
.bgprev .img{position:absolute;inset:-20px;background:center/cover no-repeat}
.bgprev .dim{position:absolute;inset:0;background:var(--bg)}
.bgprev .card{position:absolute;left:14px;right:14px;bottom:14px;background:var(--bg2);border-radius:14px;padding:10px 12px;font-size:15px}
.bgprev .t{position:absolute;left:16px;top:12px;font-size:24px;font-weight:700;text-shadow:0 0 14px var(--bg),0 0 3px var(--bg)}
.demo{display:flex;gap:10px;align-items:center;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));font-size:13px;color:var(--label2);overflow-x:auto;white-space:nowrap;border-bottom:.5px solid var(--sep);background:var(--bg2)}
.demo b{color:var(--label)}
.demo select{font-size:13px;border:0;background:var(--fill);border-radius:8px;padding:4px 8px}
.demo .sp{flex:1}
.demo button{font-size:13px;border:0;background:none;color:var(--blue);padding:4px 6px}
.app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 42px);min-height:calc(100dvh - 42px)}
.side{position:sticky;top:0;height:calc(100vh - 42px);height:calc(100dvh - 42px);padding:12px;display:flex;flex-direction:column}
.side-in{flex:1;border-radius:26px;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.side h1{font-size:22px;font-weight:700;margin:4px 10px 10px}
.sbtn{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border:0;border-radius:12px;background:none;text-align:left;font-size:16px;width:100%;flex:0 0 auto}
.sbtn:hover{background:var(--fill)}
.sbtn[aria-current=page]{background:var(--blue);color:#fff}
.sbtn svg{width:22px;height:22px;flex:0 0 22px}
.sbtn .cnt{margin-left:auto}
.side .search{margin:0 2px 10px;flex:0 0 40px}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 2px;font-size:15px}
main{min-width:0;padding:0 max(28px,env(safe-area-inset-right,0px)) 60px 28px;container-type:inline-size;container-name:main}
.page{max-width:760px;margin:0 auto}
.page.wide{max-width:1000px}
.navbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;min-height:56px;margin:0 -28px;padding:8px 28px}
.navbar.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);border-bottom:.5px solid var(--glass-line)}
.navbar .ttl{flex:1;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar.scrolled .ttl{opacity:1}
.navbar .l,.navbar .r{display:flex;gap:6px;min-width:90px;align-items:center}
.navbar .r{justify-content:flex-end}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--blue);font-size:17px;padding:6px 4px;margin-left:-6px;max-width:170px}
.back svg{width:22px;height:22px;flex:0 0 22px}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circle{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:.5px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));color:var(--label);padding:0}
.circle svg{width:20px;height:20px}
.circle.tint{background:var(--blue);color:#fff;border-color:transparent}
.large{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.01em;margin:4px 0 14px;word-break:break-all}
.subtitle{color:var(--label2);font-size:15px;margin:-8px 0 18px}
.gh{font-size:13px;color:var(--label2);margin:22px 18px 7px}
.gf{font-size:13px;color:var(--label2);margin:7px 18px 0;line-height:1.45}
.group{background:var(--bg2);border-radius:var(--r-group);overflow:hidden}
.group>*{position:relative}
.group>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep);z-index:1}
.group>.has-ico+*::before{left:60px}
.cell{display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 16px;width:100%;border:0;background:none;text-align:left;font-size:17px}
button.cell:active{background:var(--fill)}
button.cell:disabled{opacity:.4}
.cellwrap{display:flex;align-items:center}
.cellwrap>.cell{flex:1;min-width:0}
.cellwrap .more{flex:0 0 44px;height:44px;margin-right:6px;border:0;border-radius:50%;background:none;color:var(--label2);display:grid;place-items:center}
.cellwrap .more:hover{background:var(--fill)}
.cellwrap .more svg{width:22px;height:22px}
.ico{width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:grid;place-items:center;color:#fff}
.ico svg{width:19px;height:19px}
.tx{flex:1;min-width:0}
.tx .t{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tx .s{font-size:14px;color:var(--label2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .s.wrap{white-space:normal}
.val{color:var(--label2);font-size:16px;text-align:right;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chev{width:14px;height:14px;color:var(--label3);flex:0 0 14px}
.cell.danger{color:var(--red);justify-content:center}
.cell.action{color:var(--blue)}
.cell.center{justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--green);display:inline-block}
.dot.down,.dot.suspended{background:var(--red)}.dot.maint{background:var(--indigo)}.dot.installing{background:var(--orange)}.dot.off{background:var(--gray)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:13px;font-weight:500;background:var(--fill);color:var(--label2);white-space:nowrap}
.pill.g{background:color-mix(in srgb,var(--green) 18%,transparent);color:color-mix(in srgb,var(--green) 70%,var(--label))}
.pill.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pill.o{background:color-mix(in srgb,var(--orange) 18%,transparent);color:color-mix(in srgb,var(--orange) 70%,var(--label))}
.pill.b{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;font-weight:600;display:inline-grid;place-items:center;padding:0 6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@container main (min-width:600px){.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--bg2);border-radius:var(--r-card);padding:12px 14px;border:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:84px}
button.tile:active{transform:scale(.98)}
button.tile:disabled{opacity:.5}
.tile .top{display:flex;justify-content:space-between;align-items:center}
.tile .n{font-size:28px;font-weight:700;line-height:1}
.tile .l{font-size:15px;color:var(--label2);font-weight:500}
.hero{background:var(--bg2);border-radius:26px;padding:18px;margin-bottom:6px}
.hero .addr{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--fill);font-family:var(--mono);font-size:15px;border:0;width:100%;text-align:left}
.hero .addr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .addr svg{width:18px;height:18px;color:var(--blue);flex:0 0 18px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:var(--fill);border-radius:16px;padding:12px 2px 10px;font-size:11.5px;white-space:nowrap;letter-spacing:-.03em;font-weight:500;color:var(--blue)}
.act svg{width:22px;height:22px}
.act:disabled{opacity:.35}
.act.red{color:var(--red)}
.meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.meter i.mid{background:var(--orange)}.meter i.hot{background:var(--red)}
.beats{display:flex;gap:2px;height:22px;margin-top:8px}
.beats i{flex:1;border-radius:3px;background:var(--green)}
.beats i.d{background:var(--red)}.beats i.m{background:var(--indigo)}.beats i.e{background:var(--fill2)}.beats i.s{background:var(--gray)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:var(--r-card);background:var(--bg2);margin-bottom:10px;font-size:15px}
.banner>svg{width:22px;height:22px;flex:0 0 22px;color:var(--blue)}
.banner.w>svg{color:var(--orange)}.banner.e>svg{color:var(--red)}.banner.ok>svg{color:var(--green)}
.banner .tx b{display:block;font-weight:600;font-size:16px;margin-bottom:2px}
.banner .bb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:22px;border:0;background:var(--fill);color:var(--blue);font-size:17px;font-weight:600;white-space:nowrap}
.btn.fill{background:var(--blue);color:#fff}
.btn.red{color:var(--red)}
.btn.sm{height:34px;padding:0 14px;font-size:15px;border-radius:17px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px}
.field label{flex:0 0 auto;min-width:92px;font-size:17px}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;font-size:17px;text-align:right;padding:14px 0;outline:none}
.field textarea{text-align:left;min-height:90px;resize:vertical}
.field.col{flex-direction:column;align-items:stretch;gap:0;padding-top:10px}
.field.col label{font-size:13px;color:var(--label2)}
.field.col input,.field.col textarea{text-align:left;padding:8px 0 12px}
.field select{appearance:none;-webkit-appearance:none;color:var(--blue);cursor:pointer;text-align-last:right}
.field select:disabled{color:var(--label3)}
.field .unit{color:var(--label2);font-family:var(--mono);font-size:15px}
.err-t{color:var(--red)!important}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;cursor:pointer;flex:0 0 51px;margin:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:left .2s}
.switch:checked{background:var(--green)}
.switch:checked::after{left:22px}
.switch:disabled{opacity:.4}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:8px;height:32px;font-size:14px;font-weight:500;white-space:nowrap;padding:0 10px}
.seg button[aria-pressed=true]{background:var(--bg2);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
input[type=range]{width:100%;accent-color:var(--blue)}
.searchbox{display:flex;align-items:center;gap:8px;height:40px;border-radius:12px;background:var(--fill);padding:0 12px;color:var(--label2);border:0;width:100%;font-size:17px;text-align:left}
.searchbox svg{width:18px;height:18px;flex:0 0 18px}
.searchbox input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0;color:var(--label)}
.kbd{margin-left:auto;font-size:12px;border:1px solid var(--sep);border-radius:5px;padding:0 5px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pk{border:2px solid transparent;background:var(--bg2);border-radius:var(--r-card);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:78px}
.pk b{font-size:17px}
.pk small{font-size:13px;color:var(--label2);line-height:1.35}
.pk[aria-pressed=true]{border-color:var(--blue)}
.pv{width:100%;border-collapse:collapse;font-size:15px}
.pv td{padding:9px 16px;border-top:.5px solid var(--sep);word-break:break-all}
.pv tr:first-child td{border-top:0}
.pv td:first-child{font-family:var(--mono);color:var(--label2);width:80px}
.pv tr.x td{color:var(--label3);text-decoration:line-through}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{background:var(--bg2);border-radius:14px;padding:10px 12px;border:0;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:14px}
.slot .p{font-family:var(--mono);color:var(--label2);font-size:13px}
.slot .h{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.used{box-shadow:inset 0 0 0 2px var(--blue)}
.slot.held{box-shadow:inset 0 0 0 2px var(--orange)}
.slot.off{opacity:.45}
.tabbar{position:fixed;left:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;display:none;gap:2px;padding:5px;border-radius:32px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:64px;height:54px;border:0;border-radius:27px;background:none;font-size:10.5px;font-weight:600;color:var(--label);position:relative}
.tb svg{width:24px;height:24px}
.tb[aria-current=page]{color:var(--blue);background:var(--fill)}
.tb .badge{position:absolute;top:2px;right:8px;min-width:18px;height:18px;font-size:11px;border-radius:9px}
.tsearch{position:fixed;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:none!important;width:58px!important;height:58px!important}
/* ---- 画面幅ごとの配置 ----
   1100px〜      PC：サイドバー300px
   700〜1099px   フォルダブルを開いた状態・タブレット：細めのサイドバー
   〜699px       スマホ・フォルダブルを閉じた状態：下のタブバー
   〜359px       幅の狭い画面（折りたたみ時のカバー画面など）：さらに詰める */
@media (max-width:1099px) and (min-width:700px){
  .app{grid-template-columns:248px 1fr}
  .side{padding:10px 0 10px 10px}
  .side h1{font-size:20px}
  main{padding:0 20px 48px}
  .navbar{margin:0 -20px;padding:8px 20px}
}
@media (max-width:699px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .tabbar{display:flex}
  .tsearch:not([hidden]){display:grid!important}
  main{padding:0 max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .navbar{margin:0 -16px;padding:8px 16px}
  .large{font-size:32px}
}
@media (max-width:370px){.tb{width:56px}}
@media (max-width:359px){
  main{padding-left:12px;padding-right:12px}
  .navbar{margin:0 -12px;padding:8px 12px}
  .large{font-size:28px}
  .tb{width:52px;font-size:10px}
  .tabbar{left:10px}.tsearch{right:10px}
  .tiles{gap:8px}.tile{padding:10px 12px;min-height:76px}.tile .n{font-size:24px}.tile .l{font-size:14px}
  .hero{padding:14px;border-radius:22px}.hero h1{font-size:24px!important}
  .acts{gap:6px}.act{font-size:10.5px}
  .cell{padding:10px 12px;gap:12px}
  .field{padding:0 12px}.field label{min-width:76px;font-size:16px}
  .pick{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
  .slotgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
  .seg button{padding:0 8px;font-size:13px}
}
/* 横向きのスマホ（高さが低い）：タイトルを小さく、シートは画面いっぱい */
@media (max-height:500px) and (orientation:landscape){
  .large{font-size:26px;margin-bottom:8px}
  .scrim{align-items:stretch;padding:0 max(12px,env(safe-area-inset-left,0px))}

function hostFor(rule, port, serverName){
  const n = rule.start + (port - rule.ps);
  return rule.tpl.replace(/\{server\}/g, serverName || "{server}").replace(/\{nnn\}/g, String(n).padStart(3, "0")).replace(/\{nn\}/g, String(n).padStart(2, "0")).replace(/\{n\}/g, String(n)).replace(/\{port\}/g, String(port));
}
const domainOf = id => D.domains.find(d => d.id === Number(id));
const ruleOfPort = p => D.rules.find(r => p >= r.ps && p <= r.pe);
const isFixed = r => !r.tpl.includes("{server}");
function slotsOf(rule){
  const out = [];
  for (let p = rule.ps; p <= rule.pe; p++){
    const excluded = rule.excl.includes(p), sv = D.servers.find(s => s.port === p), tr = D.trash.find(s => s.port === p), disabled = D.disabledSlots.includes(p);
    out.push({port:p, rule, server:sv, trash:tr, host:isFixed(rule) ? hostFor(rule, p) : (sv ? sv.id : tr ? tr.id : null),
      status: excluded ? "excluded" : sv ? "assigned" : tr ? "held" : disabled ? "disabled" : "free"});
  }
  return out;
}
const fqdnOf = (rule, slot) => `${slot.host || "（サーバー名）"}.${domainOf(rule.domain).name}`;
function addrOf(s){
  if (s.domain && s.domain.state === "有効") return s.domain.name;
  const r = ruleOfPort(s.port); if (!r) return `edge:${s.port}`;
  return `${isFixed(r) ? hostFor(r, s.port) : s.id}.${domainOf(r.domain).name}`;
}
const edgeName = s => { const r = ruleOfPort(s.port); return r ? `${domainOf(r.domain).edgeHost}.${domainOf(r.domain).name}` : "edge"; };
const rulesFor = owner => D.rules.filter(r => r.assign === "shared" || r.user === owner);
const freeSlots = owner => rulesFor(owner).flatMap(r => slotsOf(r).filter(x => x.status === "free"));

async function loadBgFile(file){
  if (!file) return;
  if (!/^image\//.test(file.type) && !/\.(heic|heif)$/i.test(file.name)) return toast("画像ファイルを選んでください", "warn");
  if (file.size > 20 * 1024 * 1024) return toast("20MB 以下の画像を選んでください", "warn");
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
    const scale = Math.min(1, 2560 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);   // 描き直すことで位置情報（EXIF）も消える
    S.bg = {kind:"upload", data:c.toDataURL("image/jpeg", .85)};
    if (S.dim < .3) S.dim = .35;   // 写真は文字と重なりやすいので少し薄くする
    applyBg();
    toast(saveDisplay() ? "背景を変更しました" : "背景を変更しました（容量が足りず、再読み込みすると元に戻ります）", "ok");
    openBgSheet();
  } catch (e) {
    toast("この画像は読み込めませんでした。JPEG か PNG で試してください", "warn");
  } finally { URL.revokeObjectURL(url); }
}

function beats(s){
  let h = 0; for (const c of s.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const out = [];
  for (let i = 0; i < 30; i++){
    let c = "";
    if (s.fresh) c = i < 30 - s.fresh ? "e" : "";
    else if (s.st === "installing") c = "e";
    else if (s.st === "maint") c = i > 22 ? "m" : "";
    else if (s.st === "suspended" || (s.st === "down" && s.stopped)) c = i > 20 ? "s" : "";
    else if (s.st === "down") c = i > 25 ? "d" : "";
    else if (s.recovered && i >= 27 && i < 29) c = "d";
    else c = ((h + i * 7919) % 29 === 0) ? "d" : "";
    out.push(`<i class="${c}"></i>`);
  }
  return `<div class="beats" role="img" aria-label="直近30回の確認結果">${out.join("")}</div>`;
}

  m.innerHTML = items.map(x => x === "-" ? "<hr>" : `<button role="menuitem" class="${x.red ? "red" : ""}" data-act="${x.act}" data-arg="${esc(x.arg ?? "")}" ${x.disabled ? "disabled style='opacity:.4'" : ""}>${esc(x.label)}${ic(x.icon)}</button>`).join("");
  m.hidden = false;
  const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : {right:innerWidth - 20, bottom:80, top:60};
  const w = m.offsetWidth, h = m.offsetHeight;
  const left = Math.min(innerWidth - w - 12, Math.max(12, r.right - w));
  let t = r.bottom + 6; if (t + h > innerHeight - 12) t = Math.max(12, r.top - h - 6);
  m.style.left = left + "px"; m.style.top = t + "px";
  const f = m.querySelector("button:not([disabled])"); if (f) f.focus();
}

function openRule(id, domainId){
  const r = id ? D.rules.find(x => x.id === Number(id)) : null;
  S.rule = r ? {...r, excl:[...r.excl], exclText:r.excl.join(", ")}
    : {id:null, name:"", domain:Number(domainId) || D.domains.find(d => d.def).id, ps:25560, pe:25569, tpl:"mc{nn}trt", start:0, excl:[], exclText:"", mode:"cname_edge", ip:null, srv:true, pre:true, assign:"shared", user:null};
  if (!r){ // 既存の枠と重ならない初期値にする
    while (D.rules.some(x => !(S.rule.pe < x.ps || S.rule.ps > x.pe))){ S.rule.ps += 10; S.rule.pe += 10; }
    S.rule.start = S.rule.ps % 100;
  }
  renderRule();
}
function ruleProblems(r){
  const p = [];
  if (!r.name.trim()) p.push("名前を入力してください");
  if (!(Number.isInteger(r.ps) && Number.isInteger(r.pe) && r.ps >= 1024 && r.ps <= 65535 && r.pe >= 1024 && r.pe <= 65535)) p.push("ポートは 1024〜65535 の整数にしてください");
  else if (r.pe < r.ps) p.push("終了ポートは開始ポート以上にしてください");
  else if (r.pe - r.ps >= 200) p.push("1つの枠は200ポートまでです");
  else { const o = D.rules.find(x => x.id !== r.id && !(r.pe < x.ps || r.ps > x.pe)); if (o) p.push(`ポートが「${o.name}」（${o.ps}–${o.pe}）と重なっています`); }
  if (!Number.isInteger(r.start) || r.start < 0) p.push("開始番号は0以上の整数にしてください");
  const tokens = r.tpl.match(/\{[^}]*\}/g) || [];
  const bad = tokens.filter(t => !["{n}","{nn}","{nnn}","{port}","{server}"].includes(t));
  if (!r.tpl) p.push("ホスト名を入力してください");
  if (bad.length) p.push(`使えない記号：${bad.join(" ")}`);
  if (r.tpl.includes("{server}") && r.tpl !== "{server}") p.push("{server} は単独で使ってください");
  if (r.tpl && !r.tpl.includes("{server}") && !/\{(n|nn|nnn|port)\}/.test(r.tpl)) p.push("番号（{nn} など）か {port} を含めてください");
  if (r.mode === "a_ip" && !r.ip) p.push("IP アドレスを選んでください");
  if (r.assign === "user" && !r.user) p.push("専用にするユーザーを選んでください");
  if (!p.filter(x => x !== "名前を入力してください").length && isFixed(r)){
    const d = domainOf(r.domain), seen = new Set();
    for (let port = r.ps; port <= r.pe; port++){
      if (r.excl.includes(port)) continue;
      const h = hostFor(r, port);
      if (!LABEL.test(h)){ p.push(`「${h}」はホスト名に使えません（英小文字・数字・ハイフン、63文字まで）`); break; }
      if (RESERVED.includes(h)){ p.push(`「${h}」はシステムで使う名前です`); break; }
      if (seen.has(h)){ p.push(`「${h}」が重複しています`); break; } seen.add(h);
      const clash = D.rules.find(x => x.id !== r.id && x.domain === r.domain && isFixed(x) && slotsOf(x).some(s => s.host === h && s.status !== "excluded"));
      if (clash){ p.push(`${h}.${d.name} は「${clash.name}」で使われています`); break; }
      if (D.bindings.some(b => b.domain === r.domain && b.host === h)){ p.push(`${h}.${d.name} は IP の紐付けで使われています`); break; }
    }
  }
  if (r.id){
    const inUse = slotsOf(D.rules.find(x => x.id === r.id)).filter(x => x.status === "assigned" || x.status === "held");
    const lost = inUse.filter(x => x.port < r.ps || x.port > r.pe || r.excl.includes(x.port));
    if (lost.length) p.push(`使用中のポート（${lost.map(x => x.port).join(", ")}）を範囲外・対象外にはできません`);
    const o = D.rules.find(x => x.id === r.id);
    if (inUse.length && (o.tpl !== r.tpl || o.domain !== r.domain || o.start !== r.start)) p.push("使用中のスロットがある間は、ホスト名の決め方とドメインを変更できません");
  }
  return p;
}
function renderRule(){

  const rows = [];
  if (Number.isInteger(r.ps) && Number.isInteger(r.pe) && r.pe >= r.ps && r.pe - r.ps < 200)

      const x = r.excl.includes(port);
      rows.push(`<tr class="${x ? "x" : ""}"><td>${port}</td><td class="mono">${esc(fixed ? hostFor(r, port) : "（サーバー名）")}.${esc(d.name)}${port === 25565 && !x ? ' <span class="pill b">既定ポート</span>' : ""}</td></tr>`);
    }
  const cnt = Number.isInteger(r.ps) && Number.isInteger(r.pe) && r.pe >= r.ps ? r.pe - r.ps + 1 - r.excl.filter(x => x >= r.ps && x <= r.pe).length : 0;
  sheet(`${sheetHead(r.id ? "アドレス枠を編集" : "アドレス枠を追加", {right:"保存", rightAct:"rule-save", rightDisabled:probs.length > 0, rightId:"rule-save"})}<div class="sheet-b">
    ${group([`<div class="field"><label for="r-name">名前</label><input id="r-name" data-rule="name" value="${esc(r.name)}" placeholder="例：Minecraft 共有枠"></div>`, `<div class="field"><label for="r-dom">ドメイン</label><select id="r-dom" data-rule="domain">${D.domains.map(x => `<option value="${x.id}" ${x.id === r.domain ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>`])}
    ${group([`<div class="field"><label for="r-ps">開始ポート</label><input id="r-ps" data-rule="ps" type="number" inputmode="numeric" value="${Number.isInteger(r.ps) ? r.ps : ""}"></div>`, `<div class="field"><label for="r-pe">終了ポート</label><input id="r-pe" data-rule="pe" type="number" inputmode="numeric" value="${Number.isInteger(r.pe) ? r.pe : ""}"></div>`, `<div class="field"><label for="r-ex">対象外</label><input id="r-ex" data-rule="excl" value="${esc(r.exclText)}" placeholder="例：25560" inputmode="numeric"></div>`], "ポート", "対象外のポートは使いません。番号はポートに固定なので、25560 を対象外にしても 25561 は mc01 のままです。")}
    ${group([`<div class="field"><label for="r-tpl">ホスト名</label><input id="r-tpl" data-rule="tpl" value="${esc(r.tpl)}" class="mono" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="unit">.${esc(d.name)}</span></div>`, `<div class="field"><label for="r-st">開始番号</label><input id="r-st" data-rule="start" type="number" inputmode="numeric" value="${Number.isInteger(r.start) ? r.start : ""}" ${fixed ? "" : "disabled"}></div>`, `<div class="cell" style="flex-wrap:wrap;gap:6px">${["{nn}","{n}","{nnn}","{port}","{server}"].map(t => `<button class="btn sm" data-act="tpl-token" data-arg="${t}">${t}</button>`).join("")}</div>`], "ホスト名の決め方", "{nn} は2桁の番号（開始ポートが「開始番号」）、{port} はポート番号、{server} はサーバー名になります。")}
    <div class="gh">プレビュー（${cnt}件）</div><div class="group"><table class="pv">${rows.join("")}</table></div>
    ${probs.length ? `<div class="gf err-t" role="alert">${probs.map(esc).join("<br>")}</div>` : ""}
    ${group([`<div class="field"><label for="r-mode">DNS</label><select id="r-mode" data-rule="mode"><option value="cname_edge" ${r.mode === "cname_edge" ? "selected" : ""}>edge への CNAME（推奨）</option><option value="a_ip" ${r.mode === "a_ip" ? "selected" : ""}>IP を直接指定</option></select></div>`,
      r.mode === "a_ip" ? `<div class="field"><label for="r-ip">IP</label><select id="r-ip" data-rule="ip"><option value="">選択</option>${D.ips.map(i => `<option value="${i.id}" ${r.ip === i.id ? "selected" : ""}>${esc(i.label)}</option>`).join("")}</select></div>` : "",
      cell({title:"SRV レコード", sub:"ポートの入力なしで接続", val:`<input type="checkbox" class="switch" data-rule="srv" ${r.srv ? "checked" : ""} aria-label="SRV レコード">`}),
      cell({title:"DNS を先に作成", sub:fixed ? "割り当てた瞬間から接続できます" : "{server} の枠では使えません", val:`<input type="checkbox" class="switch" data-rule="pre" ${r.pre && fixed ? "checked" : ""} ${fixed ? "" : "disabled"} aria-label="DNS を先に作成">`})].filter(Boolean), "DNS", r.mode === "a_ip" ? "IP 直指定の場合、edge を切り替えるとこの枠のレコードもすべて書き換えます。" : `edge.${esc(d.name)} を向くので、edge を切り替えてもこの枠のレコードは変わりません。`)}
    ${group([`<div class="field"><label for="r-as">使える人</label><select id="r-as" data-rule="assign"><option value="shared" ${r.assign === "shared" ? "selected" : ""}>全員で共有</option><option value="user" ${r.assign === "user" ? "selected" : ""}>特定のユーザー</option></select></div>`,
      r.assign === "user" ? `<div class="field"><label for="r-u">ユーザー</label><select id="r-u" data-rule="user"><option value="">選択</option>${D.users.filter(u => u.role === "user").map(u => `<option ${r.user === u.n ? "selected" : ""}>${esc(u.n)}</option>`).join("")}</select></div>` : ""].filter(Boolean), "割り当て")}

  </div>`);
}

/* ---------------- デプロイ ---------------- */
function stepsHtml(j){
  return j.steps.map((st, i) => {
    let cls = "", icn = "ring", note = "";
    if (j.status === "failed"){ if (i < j.failAt){ cls = "undone"; icn = "restore"; note = st.skip ? "" : "取り消し"; } else if (i === j.failAt){ cls = "fail"; icn = "xc"; note = "失敗"; } }
    else if (st.skip){ cls = "undone"; note = st.skipNote || "対象外"; }
    else if (i < j.done){ cls = "done"; icn = "ok"; note = st.d; }
    else if (i === j.done && j.status === "run"){ cls = "run"; icn = "spin"; note = "実行中"; }
    return `<li class="${cls}">${ic(icn)}<span>${esc(st.t)}</span><small>${note}</small></li>`;
  }).join("");
}
function startDeploy({name, gameId, plan, owner, port, via}){
  const g = game(gameId), r = ruleOfPort(port), pre = !!(r && isFixed(r) && D.dnsPublished[r.id]);
  const fqdn = r ? `${isFixed(r) ? hostFor(r, port) : name}.${domainOf(r.domain).name}` : "";
  const id = ++jobSeq;
  const steps = [
    {t:"依頼の検証", d:"0.4s"}, {t:`アドレスを確保（${port}）`, d:"0.1s"}, {t:"ゲームパネルのユーザーを確認", d:"0.3s"},
    {t:"ノードを選んでサーバーを作成", d:"3.2s"}, {t:"edge に転送設定を配布", d:"0.8s"},
    {t:"DNS：CNAME", d:"0.6s", skip:pre, skipNote:"作成済み"}, {t:"DNS：SRV", d:"0.5s", skip:pre || g.kind === "tcp" || !!(r && !r.srv), skipNote:pre ? "作成済み" : "対象外"},
    {t:"起動と公開の確認", d:"6.1s"}, {t:"バックアップと期限を設定", d:"0.4s"}, {t:"監視を追加", d:"0.7s"},
  ];
  const j = {id, name, owner, fqdn, via, actor:via === "Discord" ? "tanaka" : S.user, steps, done:0, status:"run", failAt:$("#d-fail").checked ? 4 : -1};
  S.jobs.unshift(j);
  D.servers.push({id:name, owner, game:gameId, port, st:"installing", ping:null, up:100, plan, cpu:0, ram:0, disk:1, players:"0/20", days:30, backups:[], shares:[], domain:null, auto:true, pub:false, proxy:null, plugins:null, updated:true, dev:false, node:"node-tokyo-1", suspend:null, stopped:false, job:id});
  if (via === "Discord") D.discord.push({type:"job", job:id, t:now().slice(5)});
  render(); tick(j);
}
function tick(j){
  const delays = [500, 350, 450, 1400, 700, 500, 450, 1500, 450, 600];
  at(delays[j.done] || 500, () => {
    if (!S.jobs.includes(j)) return;
    if (j.failAt === j.done){
      j.status = "failed"; D.servers = D.servers.filter(s => s.job !== j.id);
      audit("サーバーを作成", `${j.owner}/${j.name}`, "失敗（取り消し済み）", j.actor, j.via);
      return refreshAfterJob(j);
    }
    j.done++;
    while (j.done < j.steps.length && j.steps[j.done].skip) j.done++;
    if (j.done >= j.steps.length){
      j.status = "done";
      const s = D.servers.find(x => x.job === j.id);
      if (s){ Object.assign(s, {st:"up", ping:38, fresh:3, cpu:12, ram:35, disk:6}); delete s.job; }
      audit("サーバーを作成", `${j.owner}/${j.name}`, "成功", j.actor, j.via);
      toast(`${j.name} を公開しました`);
      return refreshAfterJob(j);
    }
    updateJobUI(j); tick(j);
  });
}
function updateJobUI(j){
  const pct = Math.round(j.done / j.steps.length * 100) + "%", step = j.steps[Math.min(j.done, j.steps.length - 1)].t;
  document.querySelectorAll(`[data-job="${j.id}"] [data-jbar]`).forEach(b => b.style.width = pct);
  document.querySelectorAll(`[data-job="${j.id}"] [data-jstep], [data-jstep-row="${j.id}"]`).forEach(t => t.textContent = step);
  document.querySelectorAll(`[data-jsteps="${j.id}"]`).forEach(l => l.innerHTML = stepsHtml(j));
  document.querySelectorAll(`[data-djob="${j.id}"]`).forEach(e => e.outerHTML = dcJob(j));
}
function refreshAfterJob(j){
  const a = document.activeElement;
  if (S.sheet || !$("#menu").hidden || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){ S.pending = true; updateJobUI(j); return; }
  render();
}

  withdraw(){
    const u = me();
    if (u.role === "admin" && D.users.filter(x => x.role === "admin" && !x.deleting).length <= 1) return toast("最後の管理者は退会できません。先に別の管理者を任命してください", "warn");
    const own = D.servers.filter(s => s.owner === u.n);
    confirmSheet({title:"退会する", danger:true, ok:"退会を申請", requireText:u.n,
      body:`<b>7日後</b>に、次のものをすべて削除します。7日以内なら取り消せます。<ul style="margin:10px 0 0;padding-left:1.2em;line-height:1.6"><li>サーバー ${own.length}台とバックアップ（すぐに停止します）</li><li>ゲームパネルのアカウント</li><li>DNS・監視・独自ドメインの設定</li><li>表示の設定・背景の写真・通知の設定</li><li>共同管理者として参加しているサーバーへの権限</li></ul><p style="font-size:14px;color:var(--label2);margin:10px 0 0">操作ログは、あなたの名前を消した形で1年間残ります。</p>`,
      onOk(){ u.deleting = "10/6"; own.forEach(s => { if (s.st === "up" || s.st === "down") Object.assign(s, {st:"down", stopped:true}); }); D.servers.forEach(s => s.shares = s.shares.filter(x => x.user !== u.n)); audit("退会を申請", "削除予定 10/6"); render(); toast("退会を受け付けました。10/6 に削除します", "clock"); }});
  },
  "withdraw-cancel"(){ const u = me(); u.deleting = null; audit("退会を取り消し", "—"); render(); toast("退会を取り消しました。サーバーは停止したままです", "restore"); },
  "sys-check"(){ toast(sysLevel() === "ok" ? "すべて正常です" : "注意が必要な項目があります", sysLevel() === "ok" ? "ok" : "warn"); },
  "sys-toggle-bot"(){ D.botDown = !D.botDown; render(); },
  "demo-tos"(){ me().tos = false; S.surface = "panel"; $("#d-surface").value = "panel"; closeSheet(); render(); },
};

/* ---------------- イベント ---------------- */
document.addEventListener("click", e => {
  if (!$("#menu").hidden && !e.target.closest("#menu") && !e.target.closest('[data-act^="menu-"]')) closeMenu();
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn){ e.preventDefault(); if (el.closest("#menu")) closeMenu(); fn(el.dataset.arg ?? "", el); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") return renderSearch(t.value);
  if (t.id === "cf-t"){ $('[data-act="confirm-ok"]').disabled = t.value !== S.requireText; return; }
  if (t.dataset.set === "dim"){ S.dim = Number(t.value); applyBg(); $("#bg-dim-v").textContent = `${Math.round(S.dim * 100)}%`; refreshBgPreview(); saveDisplay(); return; }
  if (t.dataset.set === "blur"){ S.blur = Number(t.value); applyBg(); $("#bg-blur-v").textContent = `${S.blur}px`; refreshBgPreview(); saveDisplay(); return; }
  if (t.dataset.set === "glass"){ S.glass = Number(t.value); saveDisplay(); document.documentElement.style.setProperty("--ga", S.glass); const v = $("#gl-v"); if (v) v.textContent = S.glass >= .9 ? "不透明" : S.glass <= .55 ? "透明" : "標準"; return; }
  if (t.dataset.wz === "name" && S.wiz){
    const v = t.value.toLowerCase().replace(/\s/g, ""); if (v !== t.value) t.value = v;
    S.wiz.name = v; const prob = v ? nameProblem(v) : "";
    const h = $("#wz-h"); h.className = prob ? "err-t" : ""; h.textContent = prob || "ゲームパネルでの表示名にもなります。";
    $("#wz-next").disabled = !v || !!prob;
    const sel = $("#wz-port"); if (sel) [...sel.options].forEach(o => { const r = ruleOfPort(Number(o.value)); if (r && !isFixed(r)) o.textContent = `${v || "名前"}.${domainOf(r.domain).name}（${o.value}）`; });
    const ad = $("#wz-addr"); if (ad) ad.textContent = wizAddr(S.wiz);
    return;
  }
  if (t.dataset.rule && S.rule && t.type !== "checkbox" && t.tagName !== "SELECT"){
    const k = t.dataset.rule, r = S.rule;
    if (k === "excl"){ r.exclText = t.value; r.excl = t.value.split(/[,\s、]+/).filter(Boolean).map(Number).filter(n => Number.isInteger(n) && n > 0); }
    else if (["ps","pe","start"].includes(k)){ r[k] = t.value === "" ? NaN : Number(t.value); if (k === "start") r.startTouched = true; if (k === "ps" && !r.id && !r.startTouched && Number.isInteger(r.ps)) r.start = r.ps % 100; }
    else if (k === "tpl") r.tpl = t.value.toLowerCase().replace(/\s/g, "");
    else r[k] = t.value;
    refreshRuleSheet(t.id, t.type === "number" ? null : t.selectionStart);
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "d-surface"){ S.surface = t.value; closeSheet(); closeMenu(); render(); return; }
  if (t.id === "d-user"){ S.user = t.value; S.stack = []; S.mfilter = "all"; closeSheet(); closeMenu(); render(); return; }
  if (t.id === "tos-ok"){ $("#tos-btn").disabled = !t.checked; return; }
  if (t.id === "bg-file"){ loadBgFile(t.files && t.files[0]); return; }
  if (t.dataset.set === "theme"){ S.theme = t.value; saveDisplay(); render(); return; }
  if (t.dataset.set === "glass" || t.dataset.set === "dim" || t.dataset.set === "blur"){ saveDisplay(); return; }
  if (t.dataset.domainDef){ D.domains.forEach(d => d.def = d.id === Number(t.dataset.domainDef)); audit("既定のドメインを変更", domainOf(t.dataset.domainDef).name); render(); return; }
  if (t.dataset.wz && S.wiz && t.dataset.wz !== "name"){
    if (t.dataset.wz === "port") S.wiz.port = Number(t.value);
    else { S.wiz[t.dataset.wz] = t.value; if (t.dataset.wz === "owner") S.wiz.port = freeSlots(t.value)[0]?.port ?? null; }
    renderWizard(); return;
  }
  if (t.dataset.rule && S.rule && (t.type === "checkbox" || t.tagName === "SELECT")){
    const k = t.dataset.rule, r = S.rule;
    if (t.type === "checkbox") r[k] = t.checked;
    else if (k === "domain" || k === "ip") r[k] = t.value === "" ? null : Number(t.value);
    else r[k] = t.value || null;
    if (k === "mode" && r.mode === "cname_edge") r.ip = null;
    if (k === "assign" && r.assign === "shared") r.user = null;
    refreshRuleSheet(); return;
  }
  const s = curServer();
  if (!s || !t.dataset.bind) return;
  if (t.dataset.bind === "auto"){ s.auto = t.checked; audit(`自動再起動を${s.auto ? "オン" : "オフ"}`, `${s.owner}/${s.id}`); toast(`自動再起動を${s.auto ? "オン" : "オフ"}にしました`); }
  if (t.dataset.bind === "pub"){ s.pub = t.checked; audit(`状態ページを${s.pub ? "公開" : "非公開"}`, `${s.owner}/${s.id}`); toast(s.pub ? "状態ページに公開しました" : "公開をやめました"); }
  if (t.dataset.bind === "proxy"){ s.proxy = t.value || null; audit(s.proxy ? "ネットワークに参加" : "ネットワークから外す", `${s.owner}/${s.id}`); toast(s.proxy ? `${s.proxy} 経由のみにしました` : "直接接続に戻しました"); }
  render();
});
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
  if (e.key === "Escape"){ if (!$("#menu").hidden) return closeMenu(); if (S.sheet && me().tos) return closeSheet(); if (S.stack.length && !S.sheet && !typing) return ACT.back(); }
  if (!typing && !S.sheet && S.surface === "panel" && (e.key === "/" || (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey)))){ e.preventDefault(); openSearch(); }
  if (e.key === "Enter" && e.target.id === "wz-name" && !$("#wz-next").disabled){ e.preventDefault(); ACT["wz-next"](); }
  if (e.key === "Enter" && e.target.id === "q"){ const f = $("#qr [data-act]"); if (f) f.click(); }
});
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim" && me().tos) closeSheet(); });
addEventListener("resize", closeMenu);
resetState();
render();
</script>
</body>
</html>
