name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: pterodeploy, POSTGRES_PASSWORD: ci, POSTGRES_DB: pterodeploy }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pterodeploy:ci@127.0.0.1:5432/pterodeploy
    steps:
      - uses: actions/checkout@v4
      - name: シェルスクリプトの検査
        run: |
          sudo apt-get install -y -qq shellcheck haproxy nftables
          shellcheck -S warning ct/*.sh install/*.sh misc/*.sh edge/*.sh scripts/*.sh deploy/bin/*
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: 依存パッケージ
        run: pip install -r requirements-dev.txt
      - name: DB 移行（2回実行して冪等性も確認）
        run: python -m pterodeploy.migrate && python -m pterodeploy.migrate
      - name: API の起動確認
        run: |
          uvicorn pterodeploy.main:app --port 8080 &
          for i in $(seq 1 20); do curl -fsS localhost:8080/api/health && exit 0; sleep 1; done; exit 1
      - name: 静的検査
        run: ruff check . && ruff format --check .
      - name: テスト
        env: { PD_DATA_DIR: /tmp }
        run: pytest -q
